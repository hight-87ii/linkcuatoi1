<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch họp công ty</title>

    <style>
        table {
            border-collapse: collapse;
            width: 700px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Lịch họp công ty</h1>

    <table>
        <tr>
            <th>Ngày</th>
            <th>Giờ</th>
            <th>Nội dung cuộc họp</th>
        </tr>

        <tr>
            <td rowspan="2">Thứ Hai</td>
            <td>08:00 - 09:00</td>
            <td>Họp phòng kinh doanh</td>
        </tr>

        <tr>
            <td>14:00 - 15:00</td>
            <td>Họp phòng marketing</td>
        </tr>

        <tr>
            <td rowspan="2">Thứ Ba</td>
            <td>09:00 - 10:00</td>
            <td>Họp dự án A</td>
        </tr>

        <tr>
            <td colspan="2">13:00 - 16:00: Họp tổng kết dự án</td>
        </tr>
    </table>

</body>
</html>
